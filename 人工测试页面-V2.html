<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>党建工作台账 V2.0 - 人工测试清单</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: #f5f5f5; padding: 24px; color: #333; }
.container { max-width: 1100px; margin: 0 auto; }
.header { background: linear-gradient(135deg, #CC0000, #A00000); color: #fff; padding: 32px; border-radius: 12px; margin-bottom: 24px; }
.header h1 { font-size: 28px; margin-bottom: 8px; }
.header p { opacity: 0.9; font-size: 14px; }
.section { background: #fff; border-radius: 8px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.section-header { padding: 16px 20px; background: #fafafa; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 12px; }
.section-header .num { width: 28px; height: 28px; background: #CC0000; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
.section-header h2 { font-size: 16px; }
.test-list { padding: 0; }
.test-item { display: flex; align-items: flex-start; padding: 12px 20px; border-bottom: 1px solid #f8f8f8; gap: 12px; }
.test-item:last-child { border-bottom: none; }
.test-item input[type="checkbox"] { margin-top: 4px; width: 16px; height: 16px; accent-color: #CC0000; cursor: pointer; flex-shrink: 0; }
.test-item .content { flex: 1; }
.test-item .title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.test-item .desc { font-size: 12px; color: #888; }
.test-item .result { font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: 500; flex-shrink: 0; margin-top: 2px; }
.result.pass { background: #f6ffed; color: #52c41a; }
.result.fail { background: #fff2f0; color: #ff4d4f; }
.result.warn { background: #fffbe6; color: #faad14; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; margin-left: 8px; }
.badge.new { background: #e6f7ff; color: #1890ff; }
.badge.fix { background: #fff7e6; color: #fa8c16; }
.summary { position: sticky; top: 0; background: #fff; padding: 16px 20px; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
.summary-stats { display: flex; gap: 24px; }
.stat { text-align: center; }
.stat .val { font-size: 24px; font-weight: bold; }
.stat .label { font-size: 12px; color: #888; }
.stat.total .val { color: #333; }
.stat.passed .val { color: #52c41a; }
.stat.failed .val { color: #ff4d4f; }
.progress-bar { height: 6px; background: #f0f0f0; border-radius: 3px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #52c41a, #73d13d); border-radius: 3px; transition: width 0.3s; }
button { background: #CC0000; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
button:hover { background: #A00000; }
button.reset { background: #fff; color: #666; border: 1px solid #d9d9d9; }
button.reset:hover { background: #f5f5f5; }
.footer { text-align: center; padding: 24px; color: #999; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏛️ 党建工作台账应用 V2.0</h1>
    <p>人工测试清单 · 涵盖所有页面与核心功能 · 重点验证导出样式与人员管理修复</p>
  </div>

  <div class="summary">
    <div class="summary-stats">
      <div class="stat total"><div class="val" id="total">0</div><div class="label">总测试项</div></div>
      <div class="stat passed"><div class="val" id="passed">0</div><div class="label">已通过</div></div>
      <div class="stat failed"><div class="val" id="failed">0</div><div class="label">待验证/失败</div></div>
    </div>
    <div style="width:200px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;"><span>测试进度</span><span id="pct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    </div>
    <button class="reset" onclick="resetAll()">重置</button>
  </div>

  <!-- 1. 数据看板 -->
  <div class="section">
    <div class="section-header"><div class="num">1</div><h2>数据看板页面</h2></div>
    <div class="test-list" id="sec1"></div>
  </div>

  <!-- 2. 人员管理 -->
  <div class="section">
    <div class="section-header"><div class="num">2</div><h2>人员管理页面 <span class="badge fix">BUG修复</span></h2></div>
    <div class="test-list" id="sec2"></div>
  </div>

  <!-- 3. 会议管理 -->
  <div class="section">
    <div class="section-header"><div class="num">3</div><h2>会议管理页面 <span class="badge new">V2.0多选类型</span></h2></div>
    <div class="test-list" id="sec3"></div>
  </div>

  <!-- 4. 谈心谈话 -->
  <div class="section">
    <div class="section-header"><div class="num">4</div><h2>谈心谈话页面 <span class="badge new">V2.0新增</span></h2></div>
    <div class="test-list" id="sec4"></div>
  </div>

  <!-- 5. 数据管理 -->
  <div class="section">
    <div class="section-header"><div class="num">5</div><h2>数据管理页面 <span class="badge new">V2.0备份兼容</span></h2></div>
    <div class="test-list" id="sec5"></div>
  </div>

  <!-- 6. 导出功能 -->
  <div class="section">
    <div class="section-header"><div class="num">6</div><h2>导出功能（样式优化）<span class="badge fix">重点优化</span></h2></div>
    <div class="test-list" id="sec6"></div>
  </div>

  <!-- 7. 操作日志 -->
  <div class="section">
    <div class="section-header"><div class="num">7</div><h2>操作日志页面</h2></div>
    <div class="test-list" id="sec7"></div>
  </div>

  <div class="footer">
    党建工作台账 V2.0 · 人工测试清单 · 所有数据本地存储，离线可用
  </div>
</div>

<script>

  { sec: 'sec4', title: '页面加载正常', desc: 'V2.0新增页面，工具栏和谈话表格正常显示' },

  { sec: 'sec4', title: '删除谈话记录', desc: '删除前弹出确认框' },

  { sec: 'sec6', title: 'Word报告-概览统计表', desc: '4个关键指标以大字号红色数字显示在浅红背景单元格中' },
  { sec: 'sec6', title: 'Word报告-会议类型分布表', desc: '包含会议类型、次数、占比三列，数据正确' },
  { sec: 'sec6', title: 'Word报告-月度统计表', desc: '12个月数据双列展示，整齐美观' },
  { sec: 'sec6', title: 'Word报告-出勤率排行榜', desc: '前三名有奖牌标识（🥇🥈🥉），出勤率按颜色标识' },
  { sec: 'sec6', title: 'Word报告-会议明细表', desc: '包含所有会议记录，出勤率颜色标识（绿≥90%、橙≥70%、红<70%）' },
  { sec: 'sec6', title: '导出年度台账Excel', desc: '点击导出下载.xlsx文件，包含4个Sheet', important: true },

  { sec: 'sec6', title: 'Excel-Sheet2参会考勤统计', desc: '按出勤率降序排列，每人应到/实到/请假/缺席/出勤率' },
  { sec: 'sec6', title: 'Excel-Sheet3月度汇总', desc: '12个月+全年合计行' },
  { sec: 'sec6', title: 'Excel-Sheet4会议类型统计', desc: '按次数降序排列各会议类型' },

  { sec: 'sec7', title: '操作类型彩色标签', desc: '不同操作类型显示不同颜色Tag（绿新增、蓝编辑、红删除、紫导出等）' },

function render() {
  tests.forEach((t, i) => {
    const el = document.getElementById(t.sec);
    const checked = localStorage.getItem('test_' + i) === '1';
    const div = document.createElement('div');
    div.className = 'test-item';
    div.innerHTML = `
      <input type="checkbox" ${checked ? 'checked' : ''} data-idx="${i}" onchange="toggle(this)">
      <div class="content">
        <div class="title">${t.title}${t.important ? ' 🔴' : ''}</div>
        <div class="desc">${t.desc}</div>
      </div>
    `;
    el.appendChild(div);
  });
  updateStats();
}

function toggle(cb) {
  const idx = cb.dataset.idx;
  localStorage.setItem('test_' + idx, cb.checked ? '1' : '0');
  updateStats();
}

function updateStats() {
  const total = tests.length;
  let passed = 0;
  tests.forEach((_, i) => { if (localStorage.getItem('test_' + i) === '1') passed++; });
  const failed = total - passed;
  const pct = total > 0 ? Math.round(passed / total * 100) : 0;
  document.getElementById('total').textContent = total;
  document.getElementById('passed').textContent = passed;
  document.getElementById('failed').textContent = failed;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('progress').style.width = pct + '%';
}

function resetAll() {
  tests.forEach((_, i) => localStorage.removeItem('test_' + i));
  document.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
  updateStats();
}

render();
</script>
</body>
</html>
